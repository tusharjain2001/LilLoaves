        - paragraph [ref=e66]: who are we
        - generic [ref=e67]:
          - paragraph [ref=e68]: Lil’ Loaves is inspired by our two corgis, Doc and Chief (the “loaves” behind the business) a compliment that always came during those happy pauses on our walks, whenever people stopped to admire their unmistakable shape.
          - paragraph [ref=e69]: Unfortunately, we lost Doc in early 2026, and soon after, we lost our Dad as well the man who supported us in everything we did. Their passing is now our tribute our efforts to build something meaningful from losing something meaningful.
          - paragraph [ref=e70]: Through the moments of saying “goodbye”, we’ve learned a lot. We learned to slow down and find peace in the simple rhythms, like baking. We were reminded to embrace our family and to lean on each other more often. Most of all, we learned that real healing happens when you are supported by friends, family, and community.
      - img "Our two corgis, Doc and Chief" [ref=e72]
